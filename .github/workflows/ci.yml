name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: java-assignment

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # unit + @QuarkusTest (PostgreSQL via Testcontainers) + integration tests + 80% coverage gate
      - name: mvn clean verify
        run: ./mvnw -B clean verify

      - name: Coverage summary
        if: always()
        run: |
          csv=target/jacoco-report/jacoco.csv
          if [ -f "$csv" ]; then
            awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "### Line coverage: %.1f%%\n", 100*c/(m+c)}' "$csv" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: java-assignment/target/jacoco-report/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            java-assignment/target/surefire-reports/
            java-assignment/target/failsafe-reports/
          if-no-files-found: ignore
